name: CI

# `make verify` es el único juez del proyecto. CI ejecuta exactamente eso.
# Si algo pasa en local pero falla aquí, manda CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: make verify
        run: make verify
